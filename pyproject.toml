[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ev_verify"
version = "0.1.0"
description = "Python-based E-powertrain verification test bench (simulation only, not a production BMS)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EV-Verify" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requirement(id): test verifies requirement with the given ID",
    "unit: unit test",
    "integration: integration test",
    "property: property-based test",
    "fault_injection: fault injection test",
    "scenario: scenario test",
]
addopts = ["-q", "--strict-markers", "-p", "no:cacheprovider"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["ev_verify"]
branch = true
omit = ["*/tests/*", "*/scripts/*", "*/__init__.py"]
data_file = ".coverage"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == __main__:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = ["E501", "B008"]
fixable = ["E", "F", "I"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["frozenset"]

[tool.ruff.format]
preview = true
